app = "autonomous-csa-staging-web"
primary_region = "ord"
kill_signal = "SIGTERM"
kill_timeout = "20s"

[build]
  dockerfile = "apps/web/Dockerfile"

[env]
  NODE_ENV = "production"
  APP_ENV = "staging"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  NEXT_TELEMETRY_DISABLED = "1"
  API_BASE_URL = "https://autonomous-csa-staging-api.fly.dev"
  WEB_PUBLIC_URL = "https://autonomous-csa-staging-web.fly.dev"
  INTERNAL_API_URL = "http://autonomous-csa-staging-api.internal:3001"
  AUTH_COOKIE_SECURE = "true"
  AUTH_COOKIE_SAME_SITE = "lax"
  AUTH_COOKIE_NAME_PREFIX = "stg_au"
  AUTH_COOKIE_DOMAIN = "autonomous-csa-staging-web.fly.dev"
  JWT_ACCESS_TTL = "15m"
  JWT_REFRESH_TTL = "7d"
  LOG_LEVEL = "info"
  LOG_FORMAT = "json"
  LOG_PRETTY = "false"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/api/version"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]
