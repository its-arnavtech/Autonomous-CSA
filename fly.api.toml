app = "autonomous-csa-staging-api"
primary_region = "ord"
kill_signal = "SIGTERM"
kill_timeout = "20s"

[build]
  dockerfile = "apps/api/Dockerfile"

[deploy]
  release_command = "pnpm --dir /app --filter @agentic-support/db db:migrate:deploy"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  APP_ENV = "staging"
  PORT = "3001"
  TRUST_PROXY = "true"
  CORS_ALLOWED_ORIGINS = "https://autonomous-csa-staging-web.fly.dev"
  SWAGGER_ENABLED = "false"
  METRICS_ENABLED = "true"
  LOG_LEVEL = "info"
  LOG_FORMAT = "json"
  LOG_PRETTY = "false"
  JWT_ACCESS_TTL = "15m"
  JWT_REFRESH_TTL = "7d"
  HEALTH_CHECK_TIMEOUT_MS = "2000"
  SHUTDOWN_GRACE_MS = "15000"
  QUEUE_JOB_ATTEMPTS = "3"
  QUEUE_BACKOFF_BASE_MS = "1000"
  QUEUE_REMOVE_ON_COMPLETE_COUNT = "100"
  QUEUE_REMOVE_ON_FAIL_COUNT = "200"
  QUEUE_STALLED_INTERVAL_MS = "30000"
  QUEUE_MAX_STALLED_COUNT = "1"
  RATE_LIMIT_AUTH_WINDOW_MS = "15m"
  RATE_LIMIT_AUTH_MAX_ATTEMPTS = "5"
  RATE_LIMIT_AUTH_FAIL_MODE = "closed"
  RATE_LIMIT_API_WINDOW_MS = "60s"
  RATE_LIMIT_API_MAX_REQUESTS = "120"
  RATE_LIMIT_API_FAIL_MODE = "open"
  OPERATIONS_MAX_AUDIT_RANGE_DAYS = "31"
  RETENTION_REFRESH_SESSION_DAYS = "30"
  RETENTION_OPERATIONAL_FAILURE_DAYS = "30"
  RETENTION_AGENT_EVENT_DAYS = "0"
  RETENTION_EXPORT_DAYS = "7"
  RETENTION_DRY_RUN = "false"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/health/ready"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]
